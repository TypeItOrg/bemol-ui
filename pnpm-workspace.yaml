    peerDependencies:
      zod: ^4.0.0
overrides:
  postcss: "8.5.23"
  brace-expansion@^1.0.0: "1.1.21"
  brace-expansion@^2.0.0: "2.1.7"
  brace-expansion@^5.0.0: "5.0.12"
  js-yaml@4: "4.3.2"
  hono: "4.13.16"
  undici: "8.12.2"
  ip-address: "10.7.4"
  fast-uri: "3.1.9"
  "@hono/node-server": ">=2.1.6 <3"
  sharp: "^0.35.5"
  systeminformation@5: "5.33.16"
  qs@^6.0.0: "6.16.1"
  glob@^10.0.0: "14.0.2"
  "minimatch@>=7 <11": "11.0.1"
