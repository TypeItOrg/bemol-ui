<!doctype html>
<html lang="es" style="--font-sans: Manrope, system-ui, sans-serif">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#faf9f6" />
    <title>Afinando detalles - Bemol</title>
    <script>
      try {
        const theme = localStorage.getItem("theme");
        document.documentElement.classList.toggle(
          "dark",
          theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches),
        );
      } catch {}
    </script>

    <style>
      __TAILWIND_STYLES__
    </style>
    <style>
      @font-face {
        font-family: Manrope;
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url("data:font/woff2;base64,__MANROPE_FONT__") format("woff2");
      }
      @keyframes bemol-contour {
        to {
          stroke-dashoffset: -100;
        }
      }
    </style>
  </head>
  <body
    class="bg-muted text-foreground selection:bg-accent selection:text-accent-foreground grid min-h-svh place-items-center p-6 font-sans antialiased"
  >
    <main
      aria-labelledby="heading"
      class="bg-card border-border grid w-full max-w-4xl overflow-hidden rounded-2xl border md:min-h-[480px] md:grid-cols-2"
    >
      <section class="flex flex-col items-center justify-center px-6 py-10 text-center md:px-12 md:py-14">
        <h1 id="heading" class="text-2xl leading-tight font-bold tracking-tight text-balance md:text-3xl">Afinando detalles</h1>
        <p id="description" class="text-muted-foreground mt-5 max-w-sm text-sm leading-7 text-pretty sm:text-base">
          El servicio puede estar actualizándose. Cuando vuelva a estar disponible, regresarás automáticamente a donde estabas.
        </p>
        <noscript
          ><p class="mt-4 text-sm leading-6">Activá JavaScript para volver automáticamente, o recargá la página en unos instantes.</p></noscript
        >
      </section>
      <div
        role="status"
        aria-live="polite"
        aria-atomic="true"
        class="bg-primary text-accent dark:bg-background dark:text-primary flex items-center justify-center p-8 md:p-12"
      >
        <div
          class="size-40 shrink-0 md:size-52 motion-safe:[&_.maintenance-contour]:animate-[bemol-contour_3s_linear_infinite] motion-reduce:[&_.maintenance-contour]:[stroke-dasharray:none] [&_svg]:size-full"
        >
          __BEMOL_LOGO__
        </div>
        <span id="status" class="sr-only">Cargando Bemol</span>
      </div>
    </main>
    <script>
      const heading = document.getElementById("heading");
      const description = document.getElementById("description");
      const status = document.getElementById("status");
      const startedAt = Date.now();
      let checking = false;
      let timer;

      const current = new URL(window.location.href);
      let destination = current.pathname === "/maintenance.html" ? new URL("/", current.origin) : current;
      const returnTo = current.pathname === "/maintenance.html" ? current.searchParams.get("returnTo") : null;
      if (returnTo?.startsWith("/")) {
        try {
          const requested = new URL(returnTo, current.origin);
          if (requested.origin === current.origin && requested.pathname !== "/maintenance.html") {
            destination = requested;
          }
        } catch {}
      }

      function setStatus(message) {
        if (status.textContent !== message) {
          status.textContent = message;
        }
      }

      function updateMessage() {
        if (!navigator.onLine) {
          heading.textContent = "Necesitás conexión para continuar";
          description.textContent = "Revisá tu conexión a internet. Volveremos a comprobar el servicio cuando estés en línea.";
          setStatus("Esperando conexión a internet");
        } else if (Date.now() - startedAt >= 90_000) {
          heading.textContent = "La conexión está tardando más de lo esperado";
          description.textContent = "Bemol todavía no está disponible. Podés dejar esta página abierta o volver a intentarlo más tarde.";
          setStatus("Seguimos comprobando la disponibilidad");
        } else {
          heading.textContent = "Afinando detalles";
          description.textContent =
            "El servicio puede estar actualizándose. Cuando vuelva a estar disponible, regresarás automáticamente a donde estabas.";
          setStatus("Cargando Bemol");
        }
      }

      async function checkAvailability() {
        if (checking) {
          return;
        }

        clearTimeout(timer);
        updateMessage();
        if (document.hidden || !navigator.onLine) {
          timer = setTimeout(checkAvailability, 5_000);
          return;
        }

        checking = true;
        try {
          const response = await fetch("/api/health", {
            cache: "no-store",
            credentials: "omit",
            redirect: "error",
            headers: { Accept: "application/json" },
            signal: AbortSignal.timeout(5_000),
          });
          if (response.ok && (await response.json()).status === "ok") {
            setStatus("Conexión restablecida. Volviendo a Bemol…");
            window.location.replace(destination.href);
            return;
          }
        } catch {
          updateMessage();
        } finally {
          checking = false;
        }

        timer = setTimeout(checkAvailability, Date.now() - startedAt < 90_000 ? 3_000 : 10_000);
      }

      window.addEventListener("online", checkAvailability);
      window.addEventListener("offline", updateMessage);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          checkAvailability();
        }
      });
      checkAvailability();
    </script>
  </body>
</html>
