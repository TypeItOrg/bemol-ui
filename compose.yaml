services:
  dev:
    container_name: bemol-ui-dev
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - path: .env.dev
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
      BEMOL_API_URL: ${BEMOL_API_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - next-dev-cache:/app/.next
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./public
          target: /app/public
          initial_sync: true
        - action: sync
          path: ./components.json
          target: /app/components.json
          initial_sync: true
        - action: sync
          path: ./next.config.ts
          target: /app/next.config.ts
          initial_sync: true
        - action: sync
          path: ./tsconfig.json
          target: /app/tsconfig.json
          initial_sync: true
        - action: sync
          path: ./postcss.config.mjs
          target: /app/postcss.config.mjs
          initial_sync: true
        - action: sync
          path: ./eslint.config.mjs
          target: /app/eslint.config.mjs
          initial_sync: true
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml

volumes:
  next-dev-cache:
